name: CI

on:
  push:
    branches:
      - source
  issues:
    types:
      [
        opened,
        closed,
        edited,
        milestoned,
        labeled,
        unlabeled,
        reopened,
        demilestoned,
      ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
    contents: write  # 允许写入仓库（用于部署静态文件）
    issues: read     # 允许读取issue数据（用于生成博客内容）


    strategy:
      matrix:
        node-version: [19.x]

    steps:
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - uses: actions/checkout@v3
      - name: Download Issue and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm i
          pnpm action
          pnpm build
          pnpm run deploy
